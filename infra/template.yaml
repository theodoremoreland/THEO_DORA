AWSTemplateFormatVersion: 2010-09-09
Description: Infrastructure as Code for recording and calculating GitHub project DORA metrics. DynamoDB, Lambda, and API Gateway.
Transform:
  - AWS::Serverless-2016-10-31

Resources:
  ProjectEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: "Stores GitHub project event records for calculating DORA metrics (e.g. issues, PRs, and deployments)."
        trust:
          src: authored
          conf: high
    Properties:
      TableName: project-events-table
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: project_id
          AttributeType: S
        - AttributeName: event_type_and_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: project_id
          KeyType: HASH # The partition key, also known as its hash attribute. The term "hash attribute" derives from DynamoDB's usage of an internal hash function to evenly distribute data items across partitions, based on their partition key values.
        - AttributeName: event_type_and_timestamp
          KeyType: RANGE # The sort key, also known as its range attribute. The term "range attribute" derives from the way DynamoDB stores items with the same partition key physically close together, in sorted order by the sort key value.

  ProjectEventsApi:
    Type: AWS::Serverless::Api
    Metadata:
      com.aws.cloudformation.Context:
        why: "Exposes the Project Metrics API endpoints used by the client and Lambda handlers."
        trust:
          src: authored
          conf: high
    Properties:
      StageName: Prod
      OpenApiVersion: "3.0.1"
      Cors:
        AllowMethods: "'GET,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

  PostIssueFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: "Handles POST requests for GitHub Issue records in Project Metrics DynamoDB table."
        trust:
          src: authored
          conf: high
    Properties:
      CodeUri: ./
      Handler: src/handlers/post-issue.postIssueHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource:
                Fn::GetAtt:
                  - ProjectEventsTable
                  - Arn
      Environment:
        # Ref functions are not read when running API locally, must substitute with env.json
        Variables:
          PROJECT_EVENTS_TABLE:
            Ref: ProjectEventsTable
      Events:
        CreateIssue:
          Type: Api
          Properties:
            RestApiId:
              Ref: ProjectEventsApi
            Path: /issues
            Method: POST

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: "https://${ProjectEventsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  ProjectEventsTableName:
    Description: DynamoDB table storing records to calculate GitHub project DORA metrics
    Value:
      Ref: ProjectEventsTable
