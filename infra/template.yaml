AWSTemplateFormatVersion: 2010-09-09
Description: Infrastructure as Code for recording and calculating GitHub project DORA metrics. DynamoDB, Lambda, and API Gateway.
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  SonarToken:
    Type: String
    Description: The access token used to access SonarQube Cloud endpoint.
    NoEcho: true
  SonarHost:
    Type: String
    Default: "https://sonarcloud.io"
    Description: URL for SonarQube Cloud.

Resources:
  ProjectEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: "Stores GitHub project event records for calculating DORA metrics (e.g. issues, PRs, and deployments)."
        trust:
          src: authored
          conf: high
    Properties:
      TableName: project-events-table
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: project_id
          AttributeType: S
        - AttributeName: event_type_and_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: project_id
          KeyType: HASH # The partition key, also known as its hash attribute. The term "hash attribute" derives from DynamoDB's usage of an internal hash function to evenly distribute data items across partitions, based on their partition key values.
        - AttributeName: event_type_and_timestamp
          KeyType: RANGE # The sort key, also known as its range attribute. The term "range attribute" derives from the way DynamoDB stores items with the same partition key physically close together, in sorted order by the sort key value.

  ProjectEventsApi:
    Type: AWS::Serverless::Api
    Metadata:
      com.aws.cloudformation.Context:
        why: "Exposes the Project Metrics API endpoints used by the client and Lambda handlers."
        trust:
          src: authored
          conf: high
    Properties:
      StageName: Prod
      OpenApiVersion: "3.0.1"
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"
      Auth:
        ApiKeyRequired: false

  PostApiKey:
    Type: AWS::ApiGateway::ApiKey
    Metadata:
      com.aws.cloudformation.Context:
        why: "API Key for POST routes"
        trust:
          src: authored
          conf: high
    DependsOn: ProjectEventsApi
    Properties:
      Name: PostApiKey
      Enabled: true

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Metadata:
      com.aws.cloudformation.Context:
        why: ""
        trust:
          src: authored
          conf: high
    Properties:
      UsagePlanName: "ApiUsagePlan"
      ApiStages:
        - ApiId: !Ref ProjectEventsApi
          Stage: Prod

  ApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Metadata:
      com.aws.cloudformation.Context:
        why: ""
        trust:
          src: authored
          conf: high
    Properties:
      KeyId: !Ref PostApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

  PostIssueFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: "Handles POST requests for closed GitHub Issue records in Project Metrics DynamoDB table."
        trust:
          src: authored
          conf: high
    Properties:
      CodeUri: ./
      Handler: src/handlers/post-issue.postIssueHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource:
                Fn::GetAtt:
                  - ProjectEventsTable
                  - Arn
      Environment:
        # Ref functions are not read when running API locally, must substitute with env.json
        Variables:
          PROJECT_EVENTS_TABLE:
            Ref: ProjectEventsTable
      Events:
        LogClosedIssue:
          Type: Api
          Properties:
            RestApiId:
              Ref: ProjectEventsApi
            Path: /issues
            Method: POST
            Auth:
              ApiKeyRequired: true

  PostPullRequestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: "Handles POST requests for merged GitHub Pull Requests records in Project Metrics DynamoDB table."
        trust:
          src: authored
          conf: high
    Properties:
      CodeUri: ./
      Handler: src/handlers/post-pull-request.postPullRequestHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource:
                Fn::GetAtt:
                  - ProjectEventsTable
                  - Arn
      Environment:
        # Ref functions are not read when running API locally, must substitute with env.json
        Variables:
          PROJECT_EVENTS_TABLE:
            Ref: ProjectEventsTable
      Events:
        LogMergedPullRequest:
          Type: Api
          Properties:
            RestApiId:
              Ref: ProjectEventsApi
            Path: /pull-requests
            Method: POST
            Auth:
              ApiKeyRequired: true

  PostDeploymentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: "Handles POST requests for successful GitHub Action deployment records in Project Metrics DynamoDB table."
        trust:
          src: authored
          conf: high
    Properties:
      CodeUri: ./
      Handler: src/handlers/post-deployment.postDeploymentHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource:
                Fn::GetAtt:
                  - ProjectEventsTable
                  - Arn
      Environment:
        # Ref functions are not read when running API locally, must substitute with env.json
        Variables:
          PROJECT_EVENTS_TABLE:
            Ref: ProjectEventsTable
      Events:
        LogDeployment:
          Type: Api
          Properties:
            RestApiId:
              Ref: ProjectEventsApi
            Path: /deployments
            Method: POST
            Auth:
              ApiKeyRequired: true

  GetSonarMeasuresFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: "Handles GET requests for project SonarQube Cloud quality measures."
        trust:
          src: authored
          conf: high
    Properties:
      CodeUri: ./
      Handler: src/handlers/get-sonar-measures.getSonarMeasuresHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 10
      Environment:
        # Ref functions are not read when running API locally, must substitute with env.json
        Variables:
          SONAR_TOKEN:
            Ref: SonarToken
          SONAR_HOST:
            Ref: SonarHost
      Events:
        GetSonarMeasures:
          Type: Api
          Properties:
            RestApiId:
              Ref: ProjectEventsApi
            Path: /sonar-measures
            Method: GET

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: "https://${ProjectEventsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  PostApiKeyValue:
    Description: This does not do anything of value. For the time being, find the actual key on AWS console.
    Value: !Ref PostApiKey
  ProjectEventsTableName:
    Description: DynamoDB table storing records to calculate GitHub project DORA metrics
    Value:
      Ref: ProjectEventsTable
